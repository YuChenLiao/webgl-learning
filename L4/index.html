<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>L4 · 离屏渲染与后处理链</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0b0d10;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas id="gl"></canvas>

    {
      "imports": {
        "gl-matrix": "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.4/+esm"
      }
    }
  </script>
  <script type="module" src="./main.js">
  </script>
</body>

</html>
